[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haramcad"
version = "0.1.0"
description = "An API for an APP to collect information about grocery stores"
readme = "README.md"
authors = [
  {name = "Daniel Ramos Rivera", email = "daniel.ramos.rivera.dev@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "black>=26.3.1",
    "doit>=0.37.0",
    "fastapi[standard]>=0.135.2",
    "sqlmodel>=0.0.37",
]

[project.optional-dependencies]
dev = [
]

[tool.fastapi]
entrypoint = "src.main:app"
