services:
  maroodi.crawler:
    image: mukulaal
    build:
      context: ./mukulaal/
      dockerfile: Dockerfile
    ports:
      - "6800:6800"

  maroodi.db:
    image: postgres:18-alpine
    network_mode: "host"
    volumes:
      - ./data:/var/lib/postgresql/data/
    ports:
      - "5433:5433"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
