[project]
name = "mukulaal"
version = "0.1.0"
description = "Web scrapper of e-commerce sites"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "black>=25.12.0",
    "doit>=0.36.0",
    "flake8>=7.3.0",
    "playwright>=1.57.0",
    "pydantic-settings>=2.12.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "scrapy>=2.13.4",
    "scrapy-playwright>=0.0.44",
    "typer>=0.20.1",
]


[tool.setuptools]
package-dir = {"" = "src"}
